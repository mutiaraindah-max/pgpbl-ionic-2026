<ion-content [fullscreen]="true">

  <div id="mapedit"></div>

  <ion-item>
    <ion-label position="floating">Name</ion-label>
    <ion-input [(ngModel)]="name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Coordinates</ion-label>
    <ion-input [(ngModel)]="coordinates"></ion-input>
  </ion-item>

  <ion-item>
  <ion-label position="floating">Keterangan</ion-label>
  <ion-textarea
    [(ngModel)]="description"
    autoGrow="true">
  </ion-textarea>
</ion-item>

  <ion-button expand="full" (click)="save()">
    Save
  </ion-button>

</ion-content>
